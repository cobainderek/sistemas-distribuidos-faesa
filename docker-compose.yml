name: trabalho-docker

services:
  # ---------------------------------------------------------------------------
  # Banco de dados PostgreSQL
  # NAO expoe nenhuma porta para o host -> so acessivel pelos outros conteineres
  # via a rede interna "internal".
  # Dados persistidos no volume "db_data": ao desligar/recriar o conteiner,
  # os registros continuam la.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: trabalho_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pass
      POSTGRES_DB: trabalho
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d trabalho"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Sistema web (Node.js + Express + EJS)
  # Exposto na porta 8080 do host conforme exigido no enunciado.
  # Internamente o app roda na porta 3000.
  # ---------------------------------------------------------------------------
  web:
    build: ./app
    container_name: trabalho_web
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: app_pass
      DB_NAME: trabalho
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Adminer - administracao web do banco
  # Acessivel em http://localhost:8081
  # Faz login no host "db" (nome do servico Postgres na rede interna).
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: trabalho_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Portainer - gerenciamento grafico dos conteineres
  # Acessivel em http://localhost:9000 (e https://localhost:9443)
  # Monta o socket do Docker para conseguir listar/gerenciar os conteineres.
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: trabalho_portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - internal

volumes:
  db_data:
  portainer_data:

networks:
  internal:
    driver: bridge
